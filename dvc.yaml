vars:
  - src/params.py

stages:
  prepare-dataset:
    cmd: python -m src.data_tools.prepare_data
    deps:
      - ${Dataset.path}
      - src/data_tools/prepare_data.py
    params:
      - src/params.py:
          - PreparedDataset.save_path
          - PreparedDataset.vocab_path
    outs:
      - ${PreparedDataset.save_path}
      - ${PreparedDataset.vocab_path}
  balance-dataset:
    cmd: python -m src.data_tools.balance_dataset
    deps:
      - ${PreparedDataset.save_path}
      - ${AugmentedDataset.path}
      - src/data_tools/balance_dataset.py
    params:
      - src/params.py:
          - ProcessedDataset.save_path
    outs:
      - ${ProcessedDataset.save_path}
  train:
    cmd: python -m src.train_and_evaluate.train
    deps:
      - ${PreparedDataset.save_path}
      - ${PreparedDataset.vocab_path}
      - src/train_and_evaluate/train.py
    params:
      - src/params.py:
          - Dataloader
          - Model
          - Optimizer
          - Training
          - Evaluation
    outs:
      - ${Model.save_path}${Model.checkpoint_name}.pth
  evaluate:
    cmd: python -m src.train_and_evaluate.evaluate
    deps:
      - src/train_and_evaluate/evaluate.py
    params:
      - src/params.py:
          - Model
    outs:
      - ${Model.save_path}${Model.checkpoint_name}_example.txt
    always_changed: true